name: Validate ElektroPilot prototype

on:
  push:
    paths:
      - "elektropilot.html"
      - "data/**"
      - "scripts/**"
      - "hardware/**"
      - "server/**"
      - "docs/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "elektropilot.html"
      - "data/**"
      - "scripts/**"
      - "hardware/**"
      - "server/**"
      - "docs/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run application smoke tests
        run: node scripts/smoke-test.mjs
      - name: Check backend syntax
        run: node --check server/index.mjs
      - name: Run backend contract tests
        run: node --test server/test.mjs
